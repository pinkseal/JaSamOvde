<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Я здесь · Seal&amp;Tea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --ink:#14201B; --muted:#5E6B65; --line:#DFE4E0;
  --mint:#6DB89E; --mint-deep:#3F8E76; --mint-tint:#E3F1EC; --on-mint:#0E1712;
  --coral:#C93A31; --zone:#EFF3F1; --zone-line:#D6DED9;
  --display:'Unbounded','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Onest','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11150F; --card:#1A211C; --ink:#EDF2EE; --muted:#93A19A; --line:#2B332D;
    --mint:#5FAF95; --mint-deep:#8FD0BA; --mint-tint:#1C2B25; --on-mint:#0B120E;
    --coral:#E2695F; --zone:#20281F+; --zone:#202823; --zone-line:#323C33;
  }
}
:root[data-theme="dark"]{
  --bg:#11150F; --card:#1A211C; --ink:#EDF2EE; --muted:#93A19A; --line:#2B332D;
  --mint:#5FAF95; --mint-deep:#8FD0BA; --mint-tint:#1C2B25; --on-mint:#0B120E;
  --coral:#E2695F; --zone:#202823; --zone-line:#323C33;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint-deep);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ---- Login ---- */
.login{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ink)}
.login-photo{position:relative;flex:0 0 42%;overflow:hidden}
.login-photo img{width:100%;height:100%;object-fit:cover;display:block}
.login-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,23,18,.15) 0%,var(--ink) 96%)}
.login-body{flex:1;background:var(--ink);padding:0 24px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;margin-top:-46px;position:relative}
.login-logo{width:88px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.35))}
.login-brand{font-family:var(--display);font-weight:700;color:#fff;font-size:22px;letter-spacing:-.02em;margin-top:10px}
.login-tag{color:#B9C6C0;font-size:14px;margin-top:4px;text-align:center}
.login-form{width:100%;max-width:340px;margin-top:22px}
.lf{margin-bottom:12px}
.lf label{display:block;color:#B9C6C0;font-size:13px;margin-bottom:6px}
.lf input{width:100%;border:2px solid #2E3A34;background:#182119;color:#fff;border-radius:16px;padding:13px 14px;font:inherit}
.lf input:focus-visible{outline-color:var(--mint)}
.login-form .btn.big{margin-top:6px}
.login-note{color:#8A968F;font-size:12.5px;text-align:center;margin-top:14px;line-height:1.5}
.login-err{color:#FF9C93;font-size:14px;text-align:center;margin-top:2px;min-height:18px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:auto}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-t{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.hero{background:var(--mint);color:var(--on-mint);border-radius:28px;padding:20px}
.hero h1{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.hero p{margin-top:8px;font-size:15px;max-width:34ch}
.hero .lbl{font-size:14px;font-weight:500}
.clock{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .where{font-size:15px;font-weight:500}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border-radius:999px;padding:13px 20px;font-weight:700;font-size:16px;min-height:48px}
.btn.dark{background:var(--ink);color:var(--mint)}
.btn.ghost{border:2px solid var(--on-mint);color:var(--on-mint)}
.btn.main{background:var(--mint);color:var(--on-mint)}
.btn.line{border:2px solid var(--line);color:var(--ink)}
.btn.danger{border:2px solid var(--coral);color:var(--coral)}
.btn.small{padding:9px 15px;min-height:38px;font-size:14px}
.btn.big{width:100%;margin-top:16px;padding:16px 20px;font-size:18px;font-family:var(--display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hint{margin-top:12px;font-size:14px;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;gap:10px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.sec .btn{padding:10px 16px;min-height:42px;font-size:15px;flex:none}

/* ---- Zone photo cards ---- */
.zc{position:relative;display:block;width:100%;border-radius:22px;overflow:hidden;margin-top:14px;text-align:left}
.zc img{display:block;width:100%;height:172px;object-fit:cover}
.zc.mine{box-shadow:0 0 0 3px var(--coral) inset}
.zc-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,13,0) 38%,rgba(10,16,13,.78) 100%)}
.zc-info{position:absolute;left:14px;bottom:11px;color:#fff;right:78px}
.zc-info b{font-family:var(--display);font-size:16.5px;letter-spacing:-.01em;display:block;line-height:1.2}
.zc-info span{font-size:12.5px;opacity:.85}
.zc-count{position:absolute;top:10px;right:10px;background:var(--mint);color:var(--on-mint);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
.zc-avs{position:absolute;right:12px;bottom:12px;display:flex}
.zc-avs .avl{width:26px;height:26px;font-size:14px;border:2px solid rgba(255,255,255,.9);margin-left:-8px;background:var(--card)}
.zc-arrow{display:flex;justify-content:center;margin:-8px 0 0}
.zc-arrow span{background:var(--mint);color:var(--on-mint);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--bg);font-size:15px}

/* ---- invites ---- */
.req{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.req-top{display:flex;align-items:flex-start;gap:10px}
.avl{width:38px;height:38px;border-radius:50%;background:var(--zone);display:grid;place-items:center;font-size:21px;flex:none}
.req-top .who{display:flex;flex-direction:column;line-height:1.2}
.req-top .who b{font-weight:700}
.req-top .who span{font-size:13px;color:var(--muted)}
.req-when{margin-left:auto;background:var(--mint-tint);border:1px solid var(--zone-line);font-weight:700;font-size:13px;border-radius:999px;padding:5px 11px;white-space:nowrap;text-align:right}
.req-text{font-size:16px;margin-top:12px;line-height:1.4}
.req .btn.danger{margin-top:12px;padding:9px 15px;min-height:38px;font-size:14px}
.cbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cmt{display:flex;gap:9px;margin-bottom:10px}
.cmt .avl{width:28px;height:28px;font-size:15px}
.cmt .body{background:var(--zone);border-radius:14px;padding:7px 12px;font-size:14px}
.cmt .body b{font-weight:700;font-size:13px;display:block;margin-bottom:1px}
.cform{display:flex;gap:8px;margin-top:4px}
.cform input{flex:1}
.cform button{flex:none;background:var(--mint);color:var(--on-mint);border-radius:14px;padding:0 16px;font-weight:700;font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}

/* ---- profile ---- */
.me-card{text-align:center}
.me-card .big-av{width:84px;height:84px;font-size:46px;margin:6px auto 10px;border-radius:50%;background:var(--zone);display:grid;place-items:center}
.me-card h2{font-family:var(--display);font-size:22px;letter-spacing:-.02em}
.me-card .uname{color:var(--muted);font-size:14px;margin-top:2px}
.me-card p{color:var(--muted);font-size:15px;margin:6px auto 0;max-width:34ch}
.rules{padding-left:20px;margin:10px 0 0;font-size:15px}
.rules li{margin-bottom:8px}
.mode{margin-top:14px;font-size:14px;color:var(--muted);border-left:4px solid var(--mint);padding-left:12px}
.loy-head{display:flex;align-items:baseline;justify-content:space-between}
.loy-head h2{font-family:var(--display);font-size:18px;letter-spacing:-.02em}
.loy-count{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.cups{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cup{width:38px;height:38px;border-radius:50%;background:var(--zone);border:2px solid var(--zone-line);display:grid;place-items:center;font-size:19px;opacity:.4}
.cup.on{opacity:1;border-color:var(--mint);background:var(--mint-tint)}
.cup.on.last{border-color:var(--coral);background:var(--coral);opacity:1}
.loy-note{margin-top:12px;font-size:14px;color:var(--muted)}
.loy-note b{color:var(--coral)}

.tabs{display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;font-size:12px;font-weight:500;color:var(--muted);position:relative}
.tabs .ic{width:52px;height:30px;border-radius:999px;display:grid;place-items:center}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"] .ic{background:var(--mint);color:var(--on-mint)}
.badge{position:absolute;top:4px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.panel h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.panel .lead{color:var(--muted);font-size:15px;margin-top:4px}
.fl{font-weight:700;font-size:15px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:700}
.inp,.tarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit}
.tarea{resize:vertical;min-height:84px}
.two{display:flex;gap:10px}
.two > *{flex:1}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-of-type{border-bottom:0}
.person b{display:block;line-height:1.2}
.person span.m{font-size:13px;color:var(--muted)}
.panel .btn.big{margin-top:20px}
.panel .btn.line{width:100%;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Настройки заведения ---------- */
var ZONES=[
  {id:'top',      name:'Гамаки наверху',           img:function(){return ZONE_TOP;}},
  {id:'middle',   name:'Барная стойка и стол',     img:function(){return ZONE_MIDDLE;}},
  {id:'basement', name:'Подвал',                   img:function(){return ZONE_BASEMENT;}}
];
var MOODS={
  open:   {label:'Открыт к знакомству', short:'Знакомлюсь',    color:'#6DB89E'},
  games:  {label:'Играю в настолки',    short:'Играю',         color:'#3F8E76'},
  company:{label:'Ищу компанию',        short:'Ищу компанию',  color:'#C93A31'},
  quiet:  {label:'Просто чай',          short:'Просто чай',    color:'#93A19A'}
};
var H=3600000;
var LOYALTY_GOAL=8;
var MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var POLL_MS=4000;

var ZB={}; ZONES.forEach(function(z){ZB[z.id]=z;});

/* ---------- Утилиты ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDur(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowTimeStr(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function dtMillis(date,time){var p=(date||'').split('-'),t=(time||'0:0').split(':');if(p.length<3)return 0;return new Date(+p[0],+p[1]-1,+p[2],+t[0]||0,+t[1]||0).getTime();}
function fmtWhen(date,time){
  var p=(date||'').split('-');if(p.length<3)return time||'';
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.getDate()+' '+MONTHS[d.getMonth()]+', '+(time||'');
}
function fmtCmtTime(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function toMillis(v){return typeof v==='number'?v:new Date(v).getTime();}

/* ---------- API-клиент (Vercel + Postgres, реальный бэкенд) ---------- */
async function api(path,opts){
  opts=opts||{};
  var res;
  try{
    res=await fetch(path,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},opts));
  }catch(e){
    var err=new Error('network');err.network=true;throw err;
  }
  var data=null;
  try{data=await res.json();}catch(e){}
  if(!res.ok){
    var err2=new Error((data&&data.error)||('HTTP '+res.status));
    err2.status=res.status;err2.payload=data;throw err2;
  }
  return data;
}
var apiStore={
  me:function(){return api('/api/me');},
  register:function(username,password){return api('/api/register',{method:'POST',body:JSON.stringify({username:username,password:password})});},
  login:function(username,password){return api('/api/login',{method:'POST',body:JSON.stringify({username:username,password:password})});},
  logout:function(){return api('/api/logout',{method:'POST'});},
  reroll:function(){return api('/api/me',{method:'PUT',body:JSON.stringify({action:'reroll'})});},
  loyaltyPlus:function(){return api('/api/me',{method:'PUT',body:JSON.stringify({action:'loyalty-plus'})});},
  presenceList:function(){return api('/api/presence');},
  checkin:function(zone,mood){return api('/api/presence',{method:'PUT',body:JSON.stringify({zone:zone,mood:mood})});},
  leaveZone:function(){return api('/api/presence',{method:'DELETE'});},
  invitesList:function(){return api('/api/invites');},
  createInvite:function(text,date,time){return api('/api/invites',{method:'POST',body:JSON.stringify({text:text,date:date,time:time})});},
  deleteInvite:function(id){return api('/api/invites?id='+encodeURIComponent(id),{method:'DELETE'});},
  commentsList:function(){return api('/api/comments');},
  addComment:function(inviteId,text){return api('/api/comments',{method:'POST',body:JSON.stringify({inviteId:inviteId,text:text})});}
};

/* ---------- Состояние ---------- */
var $app=document.getElementById('app'),$sheet=document.getElementById('sheet'),$toast=document.getElementById('toast');
var state={screen:'boot',tab:'cafe',authMode:'login',uid:null,username:null,me:null,loyalty:0,presence:[],invites:[],comments:[],loginErr:'',loginBusy:false};
var sheet=null,lastFocus=null,raf=0,toastT=0,polls=[];

function people(){var t=Date.now();return state.presence.filter(function(p){return ZB[p.zone]&&t-toMillis(p.at)<6*H;});}
function myPresence(){var id=state.uid;return people().filter(function(p){return p.id===id;})[0]||null;}
function activeInvites(){var t=Date.now();return state.invites.filter(function(i){return dtMillis(i.date,i.time)>t-24*H;}).sort(function(a,b){return dtMillis(a.date,a.time)-dtMillis(b.date,b.time);});}
function commentsOf(id){return state.comments.filter(function(c){return c.invite_id===id;}).sort(function(a,b){return toMillis(a.at)-toMillis(b.at);});}

/* ---------- Иконки ---------- */
var ICONS={
  cafe:'<svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 11v9h12v-9"/><path d="M10 20v-5h4v5"/></svg>',
  inv:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg>'
};

/* ---------- Рендер ---------- */
function render(){
  if(state.screen==='boot'){$app.innerHTML='';return;}
  if(state.screen==='login'){$app.innerHTML=loginView();return;}
  var sc=document.getElementById('main'),top=sc?sc.scrollTop:0;
  var n=people().length,ni=activeInvites().length;
  var body=state.tab==='cafe'?cafeView():state.tab==='invites'?invitesView():profileView();
  $app.innerHTML=
    '<header class="top"><div class="brand"><img src="'+LOGO_ICON+'" alt=""><div class="brand-txt"><span class="brand-t">Seal&amp;Tea</span><span class="brand-s">Я здесь</span></div></div>'+
    '<div class="pill">В зале: '+n+'</div></header>'+
    '<main class="scroll" id="main">'+body+'</main>'+
    '<nav class="tabs" aria-label="Разделы">'+
      tab('cafe','Кафе',ICONS.cafe,0)+tab('invites','Приглашения',ICONS.inv,ni)+tab('me','Профиль',ICONS.me,0)+
    '</nav>';
  var m=document.getElementById('main');if(m)m.scrollTop=top;
  tick();
}
function tab(id,label,icon,badge){
  return '<button data-a="tab" data-id="'+id+'"'+(state.tab===id?' aria-current="page"':'')+'><span class="ic">'+icon+'</span>'+label+
    (badge?'<span class="badge">'+badge+'</span>':'')+'</button>';
}

/* ---------- Логин / регистрация ---------- */
function loginView(){
  var isReg=state.authMode==='register';
  return '<div class="login"><div class="login-photo"><img src="'+ZONE_MIDDLE+'" alt=""></div>'+
    '<div class="login-body"><img class="login-logo" src="'+LOGO_ICON+'" alt="Seal&amp;Tea">'+
    '<div class="login-brand">Я здесь</div><p class="login-tag">Личный кабинет Seal&amp;Tea</p>'+
    '<div class="row" style="justify-content:center;margin-top:16px">'+
      '<button type="button" class="btn'+(isReg?' line':' main')+' small" data-a="auth-mode" data-mode="login">Войти</button>'+
      '<button type="button" class="btn'+(isReg?' main':' line')+' small" data-a="auth-mode" data-mode="register">Создать кабинет</button>'+
    '</div>'+
    '<form class="login-form" id="loginForm" novalidate>'+
      '<div class="lf"><label for="luser">Логин</label><input class="inp" id="luser" autocomplete="username" placeholder="Например, tea_lover" maxlength="40"></div>'+
      '<div class="lf"><label for="lpass">Пароль</label><input class="inp" id="lpass" type="password" autocomplete="'+(isReg?'new-password':'current-password')+'" placeholder="Не меньше 4 символов" maxlength="80"></div>'+
      '<p class="login-err">'+esc(state.loginErr)+'</p>'+
      '<button class="btn main big" type="submit" data-a="do-auth"'+(state.loginBusy?' disabled':'')+'>'+(state.loginBusy?'Секунду…':(isReg?'Создать кабинет':'Войти'))+'</button>'+
      '<p class="login-note">Пароль защищён на сервере (bcrypt) и не виден даже нам.<br>Всё равно не используйте пароль, которым пользуетесь ещё где-то.</p>'+
    '</form></div></div>';
}
function doAuth(){
  var u=(document.getElementById('luser')||{}).value||'',p=(document.getElementById('lpass')||{}).value||'';
  u=u.trim();
  if(u.length<2){state.loginErr='Логин — минимум 2 символа';render();return;}
  if(p.length<4){state.loginErr='Пароль — минимум 4 символа';render();return;}
  state.loginErr='';state.loginBusy=true;render();
  var call=state.authMode==='register'?apiStore.register(u,p):apiStore.login(u,p);
  call.then(function(acc){
    state.uid=acc.id;state.username=acc.username;state.me={nick:acc.nick,emoji:acc.emoji};state.loyalty=Number(acc.loyalty)||0;
    afterLogin();
  }).catch(function(e){
    state.loginBusy=false;
    state.loginErr=e.network?'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.':(e.message||'Что-то пошло не так');
    render();
  });
}
function afterLogin(){
  state.loginBusy=false;state.screen='app';state.tab='cafe';
  subscribe();
  render();
}
function logout(){
  polls.forEach(function(id){clearInterval(id);});polls=[];
  apiStore.logout().catch(function(){});
  state.uid=null;state.username=null;state.me=null;state.loyalty=0;state.presence=[];state.invites=[];state.comments=[];
  state.screen='login';state.authMode='login';state.loginErr='';render();
}

/* ---------- Кафе ---------- */
function cafeView(){
  var mine=myPresence(),hero;
  if(mine){
    var mz=ZB[mine.zone],mm=MOODS[mine.mood]||MOODS.quiet;
    hero='<section class="hero"><div class="lbl">Вы в Seal&amp;Tea уже</div><div class="clock" id="timer">'+fmtDur(Date.now()-toMillis(mine.at))+'</div>'+
      '<div class="where">'+esc(mz.name)+' · '+esc(mm.short)+'</div>'+
      '<div class="row"><button class="btn dark" data-a="open-checkin">Сменить место</button><button class="btn ghost" data-a="leave">Уйти</button></div></section>';
  }else{
    hero='<section class="hero"><h1>Вы сейчас в Seal&amp;Tea?</h1><p>Отметьтесь на этаже, где сидите. Остальные увидят только ваш ник.</p>'+
      '<button class="btn dark big" data-a="open-checkin">Я здесь</button></section>';
  }
  var list=people();
  var legend=Object.keys(MOODS).map(function(k){return '<span><i class="dot" style="background:'+MOODS[k].color+'"></i>'+esc(MOODS[k].label)+'</span>';}).join('');
  var hint=list.length?'':'<p class="hint">Пока никого не отметили. Станьте первым, и остальные увидят, что в зале кто-то есть.</p>';
  var cards=ZONES.map(function(z,idx){
    var here=list.filter(function(p){return p.zone===z.id;});
    var isMine=mine&&mine.zone===z.id;
    var avs=here.slice(0,4).map(function(p){return '<span class="avl">'+esc(String(p.emoji||'🙂').slice(0,4))+'</span>';}).join('');
    var arrow=idx===1?'<div class="zc-arrow"><span>↓</span></div>':'';
    return arrow+'<button class="zc'+(isMine?' mine':'')+'" data-a="zone" data-id="'+z.id+'" aria-label="'+esc(z.name)+', человек: '+here.length+'">'+
      '<img src="'+z.img()+'" alt="'+esc(z.name)+'">'+
      '<div class="zc-grad"></div>'+
      (here.length?'<div class="zc-count">'+here.length+'</div>':'')+
      '<div class="zc-info"><b>'+esc(z.name)+'</b><span>'+(here.length?here.length+' здесь':'пока никого')+'</span></div>'+
      (avs?'<div class="zc-avs">'+avs+'</div>':'')+
    '</button>';
  }).join('');
  return hero+'<div style="margin-top:2px">'+cards+'</div><div class="legend" style="margin-top:14px">'+legend+'</div>'+hint;
}

/* ---------- Приглашения ---------- */
function invitesView(){
  var list=activeInvites();
  var head='<div class="sec"><h2>Приглашения</h2><button class="btn main" data-a="open-invite">Позвать</button></div>';
  if(!list.length){
    return head+'<div class="empty"><h3>Пока тихо</h3><p>Позовите гостей за свой стол — укажите время и пару слов о встрече.</p></div>';
  }
  return head+list.map(function(i){
    var cs=commentsOf(i.id),iAm=i.uid===state.uid;
    var cmts=cs.map(function(c){
      return '<div class="cmt"><span class="avl">'+esc(String(c.emoji||'🙂').slice(0,4))+'</span>'+
        '<div class="body"><b>'+esc(c.nick)+' · '+fmtCmtTime(toMillis(c.at))+'</b>'+esc(c.text)+'</div></div>';
    }).join('');
    return '<article class="req">'+
      '<div class="req-top"><span class="avl">'+esc(String(i.emoji||'🙂').slice(0,4))+'</span>'+
      '<div class="who"><b>'+esc(i.nick)+'</b><span>'+(iAm?'это вы':'зовёт в гости')+'</span></div>'+
      '<div class="req-when">'+esc(fmtWhen(i.date,i.time))+'</div></div>'+
      '<p class="req-text">'+esc(i.text)+'</p>'+
      (iAm?'<button class="btn danger" data-a="close-invite" data-id="'+esc(i.id)+'">Удалить заявку</button>':'')+
      '<div class="cbox">'+cmts+
      '<div class="cform"><input class="inp" type="text" maxlength="140" placeholder="Написать комментарий…" data-cid="'+esc(i.id)+'" aria-label="Комментарий">'+
      '<button data-a="send-comment" data-id="'+esc(i.id)+'">Отправить</button></div></div>'+
    '</article>';
  }).join('');
}

/* ---------- Профиль ---------- */
function profileView(){
  var mine=myPresence();
  var n=clamp(state.loyalty,0,LOYALTY_GOAL);
  var cups='';for(var i=0;i<LOYALTY_GOAL;i++){cups+='<div class="cup'+(i<n?' on':'')+(i===LOYALTY_GOAL-1&&n>=LOYALTY_GOAL?' last':'')+'">☕</div>';}
  var loyNote=n>=LOYALTY_GOAL?'<b>Следующая чашка — за счёт заведения!</b> Скажите бармену.':'До бесплатной чашки осталось <b>'+(LOYALTY_GOAL-n)+'</b>.';
  return '<div class="card me-card"><div class="big-av">'+esc(state.me.emoji)+'</div><h2>'+esc(state.me.nick)+'</h2>'+
    '<div class="uname">Кабинет: '+esc(state.username||'')+'</div>'+
    '<p>Так вас видят другие. Пароль и настоящее имя нигде не показываются.</p>'+
    '<div class="row" style="justify-content:center"><button class="btn main" data-a="reroll">Другой ник</button>'+
    (mine?'<button class="btn line" data-a="leave">Уйти с карты</button>':'')+'</div>'+
    '<button class="btn danger" style="margin-top:10px" data-a="logout">Выйти из кабинета</button></div>'+
    '<div class="card"><div class="loy-head"><h2>Ваши визиты</h2><span class="loy-count">'+n+' / '+LOYALTY_GOAL+'</span></div>'+
    '<div class="cups">'+cups+'</div><p class="loy-note">'+loyNote+'</p>'+
    '<button class="btn main small" data-a="loyalty-plus" style="margin-top:12px">+1 чашка</button></div>'+
    '<div class="card"><h2 style="font-family:var(--display);font-size:18px;letter-spacing:-.02em">Правила зала</h2><ul class="rules">'+
    '<li>Не хотите разговоров? Выберите статус «Просто чай», и вас не будут звать.</li>'+
    '<li>Знакомьтесь за столом, а не в личке: телефоны и соцсети здесь не обмениваются.</li>'+
    '<li>Если что-то не так, скажите бармену. Он поможет.</li></ul>'+
    '<p class="mode">Кабинет, отметки, приглашения и комментарии хранятся на сервере и видны всем, кто открыл это приложение.</p></div>';
}

/* ---------- Нижние листы ---------- */
function chips(group,items,sel){
  return '<div class="chips" role="group">'+items.map(function(it){
    return '<button type="button" class="chip" data-a="chip" data-group="'+group+'" data-val="'+esc(it[0])+'" aria-pressed="'+(String(it[0])===String(sel))+'">'+it[1]+'</button>';
  }).join('')+'</div>';
}
function zoneItems(){return ZONES.map(function(z){return [z.id,esc(z.name)];});}
function moodItems(){return Object.keys(MOODS).map(function(k){return [k,'<i class="dot" style="background:'+MOODS[k].color+'"></i>'+esc(MOODS[k].label)];});}

function openSheet(kind,opts){
  var mine=myPresence();
  lastFocus=document.activeElement;
  opts=opts||{};
  sheet={kind:kind,id:opts.id,f:{}};
  if(kind==='checkin'){sheet.f={zone:opts.zone||(mine&&mine.zone)||'top',mood:(mine&&mine.mood)||'open'};}
  if(kind==='invite'){var now=new Date();sheet.f={date:todayStr(now),time:nowTimeStr(now)};}
  renderSheet(true);
  var p=$sheet.querySelector('.panel');if(p)p.focus();
}
function closeSheet(){
  sheet=null;$sheet.hidden=true;$sheet.innerHTML='';
  if(lastFocus&&lastFocus.focus){try{lastFocus.focus();}catch(e){}}
}
function renderSheet(anim){
  if(!sheet)return;
  var inner='',title='';
  if(sheet.kind==='zone'){
    var z=ZB[sheet.id];if(!z){closeSheet();return;}
    title=z.name;
    var here=people().filter(function(p){return p.zone===z.id;});
    inner='<h2>'+esc(z.name)+'</h2><p class="lead">'+(here.length?'Сейчас здесь: '+here.length:'Пока здесь никого')+'</p><div style="margin-top:8px">'+
      here.map(function(p){var m=MOODS[p.mood]||MOODS.quiet;
        return '<div class="person"><span class="avl">'+esc(String(p.emoji||'🙂').slice(0,4))+'</span><div><b>'+esc(p.nick)+(p.id===state.uid?' (вы)':'')+'</b><span class="m"><i class="dot" style="background:'+m.color+'"></i>'+esc(m.label)+'</span></div></div>';
      }).join('')+'</div>'+
      '<button class="btn main big" data-a="open-checkin" data-zone="'+z.id+'">Отметиться здесь</button>';
  }else if(sheet.kind==='checkin'){
    title='Отметиться в зале';
    inner='<h2>Где вы сидите?</h2><p class="lead">Ник: '+esc(state.me.emoji+' '+state.me.nick)+'</p>'+
      '<div class="fl">Место</div>'+chips('zone',zoneItems(),sheet.f.zone)+
      '<div class="fl">Настроение</div>'+chips('mood',moodItems(),sheet.f.mood)+
      '<button class="btn main big" data-a="do-checkin">Отметиться</button>';
  }else if(sheet.kind==='invite'){
    title='Позвать в гости';
    inner='<h2>Пригласить в Seal&amp;Tea</h2>'+
      '<div class="fl"><label for="itext">Текст приглашения</label></div>'+
      '<textarea class="tarea" id="itext" maxlength="220" placeholder="Например: собираемся сыграть в Codenames, приходите с чаем"></textarea>'+
      '<div class="fl">Когда</div><div class="two">'+
      '<div><label for="idate" style="font-size:13px;color:var(--muted)">Дата</label><input class="inp" id="idate" type="date" value="'+esc(sheet.f.date)+'"></div>'+
      '<div><label for="itime" style="font-size:13px;color:var(--muted)">Время</label><input class="inp" id="itime" type="time" value="'+esc(sheet.f.time)+'"></div></div>'+
      '<button class="btn main big" data-a="do-invite">Опубликовать</button>';
  }
  $sheet.hidden=false;
  $sheet.innerHTML='<div class="scrim" data-a="close"></div><div class="panel'+(anim?' enter':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" tabindex="-1"><div class="grab"></div>'+inner+'</div>';
}

/* ---------- Действия ---------- */
function toast(msg){
  $toast.textContent=msg;$toast.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){$toast.classList.remove('on');},2400);
}
function guard(promise,okMsg){
  return promise.then(function(r){if(okMsg)toast(okMsg);return r;},function(e){
    toast(e.network?'Нет связи с сервером':(e.message||'Не получилось сохранить'));
    throw e;
  });
}
function refreshPresence(){return apiStore.presenceList().then(function(rows){state.presence=rows;schedule();});}
function refreshInvites(){return apiStore.invitesList().then(function(rows){state.invites=rows;schedule();});}
function refreshComments(){return apiStore.commentsList().then(function(rows){state.comments=rows;schedule();});}

function doCheckin(){
  var f=sheet.f;
  guard(apiStore.checkin(f.zone,f.mood)).then(function(){
    closeSheet();state.tab='cafe';render();toast('Отмечено: '+ZB[f.zone].name);
    refreshPresence();
  }).catch(function(){});
}
function doInvite(){
  var txt=(document.getElementById('itext')||{}).value||'',date=(document.getElementById('idate')||{}).value||sheet.f.date,time=(document.getElementById('itime')||{}).value||sheet.f.time;
  txt=txt.trim().slice(0,220);
  if(!txt){toast('Добавьте текст приглашения');return;}
  guard(apiStore.createInvite(txt,date,time)).then(function(){
    closeSheet();state.tab='invites';render();toast('Приглашение опубликовано');
    refreshInvites();
  }).catch(function(){});
}
function leave(){guard(apiStore.leaveZone()).then(function(){toast('Вы ушли с карты');refreshPresence();}).catch(function(){});}
function closeInvite(id){guard(apiStore.deleteInvite(id)).then(function(){toast('Заявка удалена');refreshInvites();}).catch(function(){});}
function sendComment(id,text){
  text=(text||'').trim().slice(0,140);if(!text)return;
  guard(apiStore.addComment(id,text)).then(function(){refreshComments();}).catch(function(){});
}
function reroll(){
  guard(apiStore.reroll()).then(function(persona){
    state.me=persona;render();
    if(myPresence())refreshPresence();
  }).catch(function(){});
}
function loyaltyPlus(){
  guard(apiStore.loyaltyPlus()).then(function(r){state.loyalty=r.loyalty;render();}).catch(function(){});
}

/* ---------- События ---------- */
document.addEventListener('submit',function(e){
  var f=e.target.closest?e.target.closest('#loginForm'):null;
  if(f){e.preventDefault();doAuth();}
});
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a]'):null;if(!el)return;
  var a=el.getAttribute('data-a'),id=el.getAttribute('data-id');
  if(a==='auth-mode'){state.authMode=el.getAttribute('data-mode');state.loginErr='';render();}
  else if(a==='do-auth'){doAuth();}
  else if(a==='tab'){state.tab=id;render();}
  else if(a==='zone'){openSheet('zone',{id:id});}
  else if(a==='open-checkin'){openSheet('checkin',{zone:el.getAttribute('data-zone')||undefined});}
  else if(a==='open-invite'){openSheet('invite');}
  else if(a==='close'){closeSheet();}
  else if(a==='chip'&&sheet){
    var g=el.getAttribute('data-group'),v=el.getAttribute('data-val');
    sheet.f[g]=v;
    Array.prototype.forEach.call(el.parentNode.children,function(c){c.setAttribute('aria-pressed',c===el?'true':'false');});
  }
  else if(a==='do-checkin'&&sheet){doCheckin();}
  else if(a==='do-invite'&&sheet){doInvite();}
  else if(a==='leave'){leave();}
  else if(a==='close-invite'){closeInvite(id);}
  else if(a==='send-comment'){
    var input=document.querySelector('input[data-cid="'+id+'"]');
    if(input){sendComment(id,input.value);input.value='';}
  }
  else if(a==='reroll'){reroll();}
  else if(a==='loyalty-plus'){loyaltyPlus();}
  else if(a==='logout'){logout();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheet){closeSheet();return;}
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('input[data-cid]')){
    var cid=e.target.getAttribute('data-cid');sendComment(cid,e.target.value);e.target.value='';
  }
});

function tick(){
  var el=document.getElementById('timer'),m=myPresence();
  if(el&&m)el.textContent=fmtDur(Date.now()-toMillis(m.at));
}
setInterval(tick,1000);

function schedule(){
  if(raf)return;
  raf=requestAnimationFrame(function(){raf=0;render();if(sheet&&sheet.kind==='zone')renderSheet(false);});
}

/* ---------- Опрос сервера (простая замена realtime) ---------- */
function subscribe(){
  refreshPresence();refreshInvites();refreshComments();
  polls.push(setInterval(refreshPresence,POLL_MS));
  polls.push(setInterval(refreshInvites,POLL_MS));
  polls.push(setInterval(refreshComments,POLL_MS));
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&state.screen==='app'){refreshPresence();refreshInvites();refreshComments();}
  });
}

/* ---------- Запуск ---------- */
function boot(){
  apiStore.me().then(function(acc){
    state.uid=acc.id;state.username=acc.username;state.me={nick:acc.nick,emoji:acc.emoji};state.loyalty=Number(acc.loyalty)||0;
    afterLogin();
  }).catch(function(){
    state.screen='login';render();
  });
}
boot();
})();
</script>
</body>
</html>
