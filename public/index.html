<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Я здесь · Seal&amp;Tea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --ink:#14201B; --muted:#4B5851; --line:#DFE4E0;
  --mint:#6DB89E; --mint-deep:#3F8E76; --mint-tint:#E3F1EC; --on-mint:#0E1712;
  --coral:#C93A31; --zone:#EFF3F1; --zone-line:#D6DED9;
  --display:'Unbounded','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Onest','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11150F; --card:#1A211C; --ink:#EDF2EE; --muted:#93A19A; --line:#2B332D;
    --mint:#5FAF95; --mint-deep:#8FD0BA; --mint-tint:#1C2B25; --on-mint:#0B120E;
    --coral:#E2695F; --zone:#20281F+; --zone:#202823; --zone-line:#323C33;
  }
}
:root[data-theme="dark"]{
  --bg:#11150F; --card:#1A211C; --ink:#EDF2EE; --muted:#93A19A; --line:#2B332D;
  --mint:#5FAF95; --mint-deep:#8FD0BA; --mint-tint:#1C2B25; --on-mint:#0B120E;
  --coral:#E2695F; --zone:#202823; --zone-line:#323C33;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mint-deep);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ---- Login ---- */
/* Экран входа всегда тёмный: цвета заданы жёстко и не зависят от светлой/тёмной темы устройства */
.login{--l-bg:#0B120E;--l-text:#F3F7F4;--l-sub:#C9D6CF;--l-mint:#7CCBAE;--l-on-mint:#0B120E;--l-border:#6F8579;
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--l-bg);color:var(--l-text)}
.login-photo{position:relative;flex:0 0 42%;overflow:hidden}
.login-photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.login-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,14,.30) 0%,rgba(11,18,14,.62) 55%,#0B120E 100%)}
.login-body{flex:1;background:var(--l-bg);padding:0 24px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;margin-top:-46px;position:relative;overflow-y:auto}
.login-logo{width:88px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.login-brand{font-family:var(--display);font-weight:700;color:var(--l-text);font-size:22px;letter-spacing:-.02em;margin-top:10px}
.login-tag{color:var(--l-sub);font-size:14px;margin-top:4px;text-align:center}
.login-form{width:100%;max-width:340px;margin-top:22px}
.lf{margin-bottom:12px}
.lf label{display:block;color:var(--l-sub);font-size:13.5px;font-weight:500;margin-bottom:6px}
.lf input{width:100%;border:2px solid var(--l-border);background:#16211A;color:var(--l-text);border-radius:16px;padding:13px 14px;font:inherit}
.lf input::placeholder{color:#8FA097}
.lf input:focus-visible{outline:3px solid var(--l-mint);outline-offset:2px}
.login-form .btn.big{margin-top:6px}
.login-note{color:#A9B7AF;font-size:12.5px;text-align:center;margin-top:14px;line-height:1.5}
.login-err{color:#FFB4AB;font-size:14px;font-weight:500;text-align:center;margin-top:2px;min-height:18px}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:auto}
.brand-txt{display:flex;flex-direction:column;line-height:1.1}
.brand-t{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.hero{background:var(--mint);color:var(--on-mint);border-radius:28px;padding:20px}
.hero h1{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.hero p{margin-top:8px;font-size:15px;max-width:34ch}
.hero .lbl{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;opacity:.85}
.clock{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .where{font-size:15px;font-weight:500}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border-radius:999px;padding:13px 20px;font-weight:700;font-size:16px;min-height:48px}
.btn.dark{background:#14201B;color:#8FE0C0}
.btn.ghost{border:2px solid var(--on-mint);color:var(--on-mint)}
.btn.main{background:var(--mint);color:var(--on-mint)}
.btn.line{border:2px solid var(--line);color:var(--ink)}
.login .btn.main{background:var(--l-mint);color:var(--l-on-mint);border:2px solid var(--l-mint)}
.login .btn.line{background:transparent;border:2px solid var(--l-border);color:var(--l-text)}
.login .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.danger{border:2px solid var(--coral);color:var(--coral)}
.btn.small{padding:9px 15px;min-height:38px;font-size:14px}
.btn.big{width:100%;margin-top:16px;padding:16px 20px;font-size:18px;font-family:var(--display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:13.5px;font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hint{margin-top:12px;font-size:14px;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;gap:10px}
.sec h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.sec .btn{padding:10px 16px;min-height:42px;font-size:15px;flex:none}

/* ---- Zone photo cards ---- */
.zc{position:relative;display:block;width:100%;border-radius:22px;overflow:hidden;margin-top:14px;text-align:left}
.zc img{display:block;width:100%;height:172px;object-fit:cover}
.zc.mine{box-shadow:0 0 0 3px var(--coral) inset,0 0 0 1px var(--coral)}
.zc-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,13,0) 26%,rgba(10,16,13,.88) 100%)}
.zc-info{position:absolute;left:14px;bottom:11px;color:#fff;right:78px;text-shadow:0 1px 4px rgba(0,0,0,.65)}
.zc-info b{font-family:var(--display);font-size:17px;letter-spacing:-.01em;display:block;line-height:1.2}
.zc-info span{font-size:13px;opacity:.95}
.zc-count{position:absolute;top:10px;right:10px;background:var(--mint);color:var(--on-mint);font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
.zc-mine-badge{position:absolute;top:10px;left:10px;background:var(--coral);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
.zc-avs{position:absolute;right:12px;bottom:12px;display:flex}
.zc-avs .avl{width:26px;height:26px;font-size:14px;border:2px solid rgba(255,255,255,.9);margin-left:-8px;background:var(--card)}


/* ---- Профиль заведения и «стена» (в духе соцсети): контурные карточки как у логотипа ---- */
.prof{background:var(--card);border:2px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.prof-cover{height:132px;background:var(--mint)}
.prof-cover img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.prof-body{padding:0 16px 16px}
.prof-head{display:flex;align-items:flex-end;gap:12px;margin-top:-40px}
.prof-ava{width:82px;height:82px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;overflow:hidden}
.prof-ava img{width:90%;height:auto;display:block}
.prof-name{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.15;padding-bottom:6px}
.prof-bio{margin:10px 0 0;font-size:15px;color:var(--ink)}
.prof-row{display:flex;gap:8px;margin-top:8px;font-size:14.5px;align-items:flex-start}
.prof-row .ic{flex:none}
.prof-row .txt{white-space:pre-line;color:var(--ink)}
.prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.prof-stat{border:2px solid var(--ink);border-radius:16px;background:var(--mint-tint);padding:8px 4px;text-align:center}
.prof-stat b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.prof-stat span{font-size:12px;font-weight:600;color:var(--muted)}
.prof-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.prof .btn.line{border-color:var(--ink);color:var(--ink)}
.wall-h{display:flex;align-items:center;gap:8px;margin:22px 2px 6px}
.wall-h h2{font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.wall-h .cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}
.post{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px;margin-top:12px;box-shadow:3px 3px 0 var(--ink)}
.post-top{display:flex;align-items:center;gap:10px}
.post-ava{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;overflow:hidden}
.post-ava img{width:88%;height:auto;display:block}
.post-top b{display:block;line-height:1.2}
.post-date{font-size:12.5px;color:var(--muted)}
.post h3{font-family:var(--display);font-size:16px;letter-spacing:-.01em;margin-top:10px;line-height:1.25}
.post p{margin:6px 0 0;font-size:15px;white-space:pre-line}
.wall-more{margin-top:12px;width:100%}
.sched-txt{white-space:pre-line;font-size:16px;margin-top:10px}
.adm-subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
.adm-subnav::-webkit-scrollbar{display:none}
.adm-subtab{flex:none;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.adm-subtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.adm-search{margin-top:10px}
.adm-thumb{display:block;max-height:70px;max-width:100%;border-radius:10px;border:1px solid var(--line);margin:0 0 8px}

/* ---- invites ---- */
.req{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.req-top{display:flex;align-items:flex-start;gap:10px}
.avl{width:38px;height:38px;border-radius:50%;background:var(--zone);display:grid;place-items:center;font-size:21px;flex:none}
.req-top .who{display:flex;flex-direction:column;line-height:1.2}
.req-top .who b{font-weight:700}
.req-top .who span{font-size:13px;color:var(--muted)}
.req-when{margin-left:auto;background:var(--mint-tint);border:1px solid var(--zone-line);font-weight:700;font-size:13px;border-radius:999px;padding:5px 11px;white-space:nowrap;text-align:right}
.req-text{font-size:16px;margin-top:12px;line-height:1.4}
.req .btn.danger{margin-top:12px;padding:9px 15px;min-height:38px;font-size:14px}
.cbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cmt{display:flex;gap:9px;margin-bottom:10px}
.cmt .avl{width:28px;height:28px;font-size:15px}
.cmt .body{background:var(--zone);border-radius:14px;padding:7px 12px;font-size:14px}
.cmt .body b{font-weight:700;font-size:13px;display:block;margin-bottom:1px}
.cform{display:flex;gap:8px;margin-top:4px}
.cform input{flex:1}
.cform button{flex:none;background:var(--mint);color:var(--on-mint);border-radius:14px;padding:0 16px;font-weight:700;font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:18px;color:var(--ink);margin-bottom:6px;letter-spacing:-.02em}

/* ---- profile ---- */
.me-card{text-align:center}
.me-card .big-av{width:84px;height:84px;font-size:46px;margin:6px auto 10px;border-radius:50%;background:var(--zone);display:grid;place-items:center}
.me-card h2{font-family:var(--display);font-size:22px;letter-spacing:-.02em}
.me-card .uname{color:var(--muted);font-size:14px;margin-top:2px}
.me-card p{color:var(--muted);font-size:15px;margin:6px auto 0;max-width:34ch}
.rules{padding-left:20px;margin:10px 0 0;font-size:15px}
.rules li{margin-bottom:8px}
.mode{margin-top:14px;font-size:14px;color:var(--muted);border-left:4px solid var(--mint);padding-left:12px}
.loy-head{display:flex;align-items:baseline;justify-content:space-between}
.loy-head h2{font-family:var(--display);font-size:18px;letter-spacing:-.02em}
.loy-count{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.cups{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.cup{width:38px;height:38px;border-radius:50%;background:var(--zone);border:2px solid var(--zone-line);display:grid;place-items:center;font-size:19px;opacity:.4}
.cup.on{opacity:1;border-color:var(--mint);background:var(--mint-tint)}
.cup.on.last{border-color:var(--coral);background:var(--coral);opacity:1}
.loy-note{margin-top:12px;font-size:14px;color:var(--muted)}
.loy-note b{color:var(--coral)}

.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 8px;font-weight:600;color:var(--muted)}
.tabs .ic-wrap{position:relative;display:inline-flex}
.tabs .ic{width:clamp(40px,13vw,52px);height:30px;border-radius:999px;display:grid;place-items:center;transition:background .15s,color .15s}
.tabs .tab-lbl{font-size:clamp(10.5px,3.1vw,12px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:800}
.tabs button[aria-current="page"] .ic{background:var(--mint);color:var(--on-mint);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.panel h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.panel .lead{color:var(--muted);font-size:15px;margin-top:4px}
.fl{font-weight:700;font-size:15px;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:700}
.inp,.tarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit}
.tarea{resize:vertical;min-height:84px}
.two{display:flex;gap:10px}
.two > *{flex:1}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-of-type{border-bottom:0}
.person b{display:block;line-height:1.2}
.person span.m{font-size:13px;color:var(--muted)}
.panel .btn.big{margin-top:20px}
.panel .btn.line{width:100%;margin-top:10px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var LOGO_ICON='/img/logo.png';
var ZONE_TOP='/img/zone-top.jpg';
var ZONE_MIDDLE='/img/zone-middle.jpg';
var ZONE_BASEMENT='/img/zone-basement.jpg';
var LOGIN_PHOTO='/img/login.jpg';
</script>
<script>
(function(){
'use strict';

/* ---------- Настройки заведения ---------- */
var ZONES=[
  {id:'top',      name:'Гамаки наверху',           img:function(){return state.settings.zone_img_top||ZONE_TOP;}},
  {id:'middle',   name:'Барная стойка и стол',     img:function(){return state.settings.zone_img_middle||ZONE_MIDDLE;}},
  {id:'basement', name:'Подвал',                   img:function(){return state.settings.zone_img_basement||ZONE_BASEMENT;}}
];
var MOODS={
  open:   {label:'Открыт к знакомству', short:'Знакомлюсь',    color:'#6DB89E'},
  games:  {label:'Играю в настолки',    short:'Играю',         color:'#3F8E76'},
  company:{label:'Ищу компанию',        short:'Ищу компанию',  color:'#C93A31'},
  quiet:  {label:'Просто сижу',         short:'Просто сижу',   color:'#93A19A'}
};
var H=3600000;
var CUP_GOAL=10;
var TEAPOT_GOAL=8;
var MONTHS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MONTHS_SR=['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
function monthsFor(){return state.lang==='sr'?MONTHS_SR:MONTHS;}
var POLL_MS=4000;

var ZB={}; ZONES.forEach(function(z){ZB[z.id]=z;});

/* ---------- Утилиты ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ---------- Локализация (RU/SR): весь текст для гостей, включая названия этажей и настроений.
   Панель администратора остаётся только на русском. */
var STRINGS={
  ru:{

/* ---------- API-клиент (Vercel + Postgres, реальный бэкенд) ---------- */
async function api(path,opts){
  opts=opts||{};
  var res;
  try{
    res=await fetch(path,Object.assign({credentials:'same-origin',headers:{'Content-Type':'application/json'}},opts));
  }catch(e){
    var err=new Error('network');err.network=true;throw err;
  }
  var data=null;
  try{data=await res.json();}catch(e){}
  if(!res.ok){
    var err2=new Error((data&&data.error)||(res.status===413?t('errTooBig'):('HTTP '+res.status)));
    err2.status=res.status;err2.payload=data;throw err2;
  }
  return data;
}

/* Сохраняем введённый текст, выбранные значения и фокус при перерисовке —
   иначе фоновое обновление (каждые несколько секунд) стирало бы всё, что человек набирает. */
function formKey(el){return el.id||(el.getAttribute&&el.getAttribute('data-cid')?'cid:'+el.getAttribute('data-cid'):null);}
function captureForm(){
  var cap={vals:{},activeKey:null,sel:null},active=document.activeElement;
  Array.prototype.forEach.call($app.querySelectorAll('input,textarea,select'),function(el){
    if(el.type==='file'||el.type==='button'||el.type==='submit')return;
    var key=formKey(el);if(!key)return;
    cap.vals[key]=el.value;
    if(el===active){cap.activeKey=key;try{cap.sel=[el.selectionStart,el.selectionEnd];}catch(e){}}
  });
  return cap;
}
function findByKey(key){
  return key.indexOf('cid:')===0?$app.querySelector('input[data-cid="'+key.slice(4)+'"]'):$app.querySelector('[id="'+key+'"]');
}
function restoreForm(cap){
  Object.keys(cap.vals).forEach(function(key){
    var el=findByKey(key);if(!el)return;
    if(el.tagName==='SELECT'){
      for(var i=0;i<el.options.length;i++){if(el.options[i].value===cap.vals[key]){el.value=cap.vals[key];break;}}
    }else{el.value=cap.vals[key];}
  });
  if(cap.activeKey){
    var a=findByKey(cap.activeKey);
    if(a){a.focus();if(cap.sel){try{a.setSelectionRange(cap.sel[0],cap.sel[1]);}catch(e){}}}
  }
}
/* true, если в форме что-то введено/выбрано (в т.ч. файл) — тогда фоновое обновление не перерисовывает экран */
function isFormDirty(){
  var root=document.getElementById('main');if(!root)return false;
  var els=root.querySelectorAll('input,textarea,select');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(el.type==='file'){if(el.files&&el.files.length)return true;continue;}
    if(el===document.activeElement)return true;
    if(el.tagName==='SELECT'){
      var def=0;for(var j=0;j<el.options.length;j++){if(el.options[j].defaultSelected){def=j;break;}}
      if(el.selectedIndex!==def)return true;continue;
    }

      '<button type="button" class="btn'+(isReg?' main':' line')+' small" data-a="auth-mode" data-mode="register" aria-pressed="'+isReg+'">'+t('btnRegister')+'</button>'+

      '<div class="lf"><label for="luser">'+t('fieldLogin')+'</label><input class="inp" id="luser" autocomplete="username" placeholder="'+t('loginPh')+'" maxlength="40"></div>'+
      '<div class="lf"><label for="lpass">'+t('fieldPass')+'</label><input class="inp" id="lpass" type="password" autocomplete="'+(isReg?'new-password':'current-password')+'" placeholder="'+t('passPh')+'" maxlength="80"></div>'+

function doAuth(){
  var u=(document.getElementById('luser')||{}).value||'',p=(document.getElementById('lpass')||{}).value||'';
  u=u.trim();
  if(u.length<2){state.loginErr=t('errLoginShort');render();return;}
  if(p.length<4){state.loginErr=t('errPassShort');render();return;}
  state.loginErr='';state.loginBusy=true;render();
  var call=state.authMode==='register'?apiStore.register(u,p):apiStore.login(u,p);
  call.then(function(acc){
    state.uid=acc.id;state.username=acc.username;state.me={nick:acc.nick,emoji:acc.emoji};state.loyalty=Number(acc.loyalty)||0;state.teapots=Number(acc.teapots)||0;state.isAdmin=!!acc.is_admin;
    afterLogin();
  }).catch(function(e){
    state.loginBusy=false;
    state.loginErr=e.network?t('errNet'):tErr(e.message||'Что-то пошло не так');
    render();
  });
}
function afterLogin(){
  state.loginBusy=false;state.screen='app';state.tab='cafe';
  subscribe();
  render();
}
function logout(){
  polls.forEach(function(id){clearInterval(id);});polls=[];
  apiStore.logout().catch(function(){});
  state.uid=null;state.username=null;state.me=null;state.loyalty=0;state.isAdmin=false;state.presence=[];state.invites=[];state.comments=[];state.adminUsers=[];state.adminActivity=[];
  state.screen='login';state.authMode='login';state.loginErr='';render();
}

function fmtActTime(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtDateOnly(date){var p=(date||'').split('-');if(p.length<3)return date||'';var d=new Date(+p[0],+p[1]-1,+p[2]);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function actLabel(row){
  var name=esc(row.nick)+' ('+esc(row.username)+')';
  if(row.kind==='checkin'){var z=ZB[row.detail];return name+' отметил(-ась): '+(z?esc(z.name):esc(row.detail));}
  if(row.kind==='leave'){return name+' ушёл(ушла) с карты';}
  if(row.kind==='invite'){return name+' создал(а) приглашение: «'+esc(row.detail||'')+'»';}
  if(row.kind==='comment'){return name+' написал(а) комментарий: «'+esc(row.detail||'')+'»';}
  if(row.kind==='loyalty'){
    var byAdmin=/^admin:/.test(row.detail||'');
    return name+(byAdmin?' получил(а) чашку от администратора':' сам(а) отметил(а) чашку');
  }
  return name+' · '+esc(row.kind);
}

/* Сжимаем фото прямо на телефоне: снимки с камеры весят несколько МБ и не проходят на сервер. */
function compressImage(file,maxDim,quality){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      try{
        var w=img.naturalWidth||img.width,hh=img.naturalHeight||img.height;
        var k=Math.min(1,maxDim/Math.max(w,hh));
        var cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(hh*k));
        var c=document.createElement('canvas');c.width=cw;c.height=ch;
        var ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',quality));
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('img'));};
    img.src=url;
  });
}
function firstFile(id){var el=document.getElementById(id);return el&&el.files&&el.files[0]?el.files[0]:null;}
function adminUploadImages(entries,okMsg){
  if(!entries.length){toast('Сначала выберите файл');return;}
  toast('Загружаю…');
  Promise.all(entries.map(function(e){
    return compressImage(e.file,e.maxDim,e.quality).then(function(url){return [e.key,url];});
  })).then(function(pairs){
    var partial={};pairs.forEach(function(pr){partial[pr[0]]=pr[1];});
    return guard(apiStore.adminSetSettings(partial));
  }).then(function(s){
    state.settings=s;render();refreshSettings(true);toast(okMsg);
  }).catch(function(e){
    if(!e||!e.toasted)toast('Не удалось прочитать картинку. Попробуйте JPG или PNG.');
  });
}

/* ---------- Опрос сервера (простая замена realtime) ---------- */
function subscribe(){
  refreshPresence(true);refreshInvites(true);refreshComments(true);refreshSettings(true);refreshAnnouncements(true);
  polls.push(setInterval(function(){refreshPresence();},POLL_MS));
  polls.push(setInterval(function(){refreshInvites();},POLL_MS));
  polls.push(setInterval(function(){refreshComments();},POLL_MS));
  polls.push(setInterval(function(){refreshSettings();},POLL_MS*3));
  polls.push(setInterval(function(){refreshAnnouncements();},POLL_MS*3));
  if(!visBound){
    visBound=true;
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='visible'&&state.screen==='app'){refreshPresence();refreshInvites();refreshComments();refreshSettings();refreshAnnouncements();}
    });
  }
}

function boot(){
  apiStore.me().then(function(acc){
    state.uid=acc.id;state.username=acc.username;state.me={nick:acc.nick,emoji:acc.emoji};state.loyalty=Number(acc.loyalty)||0;state.teapots=Number(acc.teapots)||0;state.isAdmin=!!acc.is_admin;
    afterLogin();
  }).catch(function(){
    state.screen='login';render();
  });
}
boot();
})();
</script>
